<!doctype html>
<html>
<head><meta charset="utf-8"><title>Hero preview</title>
<style>body{margin:0} .pad{padding:24px}</style></head>
<body class="av">
<section class="av-night av-hero">
  <div>
    <span class="av-eyebrow">Chartered accountants for UK SMEs</span>
    <h1>Numbers you can trust. Advice you can <span class="av-accent">use.</span></h1>
    <p class="av-hero-lead">Bookkeeping, payroll, VAT and tax for growing UK firms. One fixed monthly fee and a named manager who answers the phone.</p>
    <div class="av-hero-actions"><a class="av-btn av-btn--ember" href="#">Book a free consultation <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a><a class="av-btn av-btn--ghost" href="#">See our services</a></div>
    <div class="av-hero-proof"><span class="av-badge av-badge--night av-notch-s">ICAEW</span><span class="av-badge av-badge--night av-notch-s">ACCA</span><span class="av-badge av-badge--night av-notch-s">UK-WIDE</span></div>
  </div>
  <form class="av-panel" onsubmit="return false">
    <h3>Get a fixed quote in 48 hours</h3>
    <div class="av-field"><label for="hn">Your name</label><input id="hn" class="av-input" placeholder="Your name"></div>
    <div class="av-field"><label for="he">Work email</label><input id="he" class="av-input" placeholder="you@yourfirm.co.uk"></div>
    <button class="av-btn av-btn--ember" type="submit">Get my quote</button>
  </form>
  <svg class="av-pulse av-pulse--draw" viewBox="0 0 1200 40" preserveAspectRatio="none" aria-hidden="true"><path d="M0 20.0 H720 L736 6.0 L752 36.0 L768 2.0 L784 38.0 L798 20.0 H1200"/></svg>
</section>
</body>
</html>
